<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Vishal Bagi</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="preload" href="./assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/css/style.css">

  <style>
    /* the only page-specific rule — everything else comes from the tokens */
    .notfound {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: var(--gutter);
      text-align: center;
    }

    .notfound__code {
      font-family: var(--ff-mono);
      font-size: var(--step-6);
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>

  <main class="notfound">
    <div>
      <p class="notfound__code">404</p>

      <h1 class="section-title" style="margin-top: var(--space-5)">This page doesn't exist</h1>

      <p class="section-lede" style="margin-inline: auto; max-width: 40ch">
        The link may be out of date, or the page may have moved. Everything lives on the one page.
      </p>

      <p style="margin-top: var(--space-8)">
        <a class="btn btn--primary" href="/">Back to the portfolio</a>
      </p>
    </div>
  </main>

</body>

</html>
