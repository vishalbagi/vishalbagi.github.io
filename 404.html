<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Vishal Bagi</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1e1e1f">

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: hsl(0, 0%, 7%);
      color: hsl(0, 0%, 84%);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: hsl(240, 2%, 12%);
      border: 1px solid hsl(0, 0%, 22%);
      border-radius: 20px;
      box-shadow: -4px 8px 24px hsla(0, 0%, 0%, 0.25);
      padding: 40px 30px;
      max-width: 460px;
      text-align: center;
    }

    .code {
      background: linear-gradient(to right, hsl(45, 100%, 72%), hsl(35, 100%, 68%));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 56px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      color: hsl(0, 0%, 98%);
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    p { font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

    a {
      color: hsl(45, 100%, 72%);
      border: 1px solid hsl(0, 0%, 22%);
      border-radius: 14px;
      display: inline-block;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 14px;
      transition: 0.25s ease;
    }

    a:hover, a:focus-visible { background: hsl(240, 2%, 20%); }
  </style>
</head>

<body>

  <div class="card">
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be out of date, or the page may have moved. Everything lives on the one page.</p>
    <a href="/">Back to the portfolio</a>
  </div>

</body>

</html>
